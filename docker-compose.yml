version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: studio_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio_app
      POSTGRES_PASSWORD: studio123
      POSTGRES_DB: studiobook_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_app -d studiobook_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studio_booking_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://studio_app:studio123@db:5432/studiobook_db
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-with-secure-random-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web (nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studio_booking_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: studio_booking_network
