apiVersion: v1
kind: Service
metadata:
  name: studio-booking-frontend
  namespace: startup
  labels:
    app: studio-booking-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: studio-booking-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-booking-frontend
  namespace: startup
  labels:
    app: studio-booking-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studio-booking-frontend
  template:
    metadata:
      labels:
        app: studio-booking-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: the_startup-frontend:final
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      restartPolicy: Always