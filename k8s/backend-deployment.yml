apiVersion: v1
kind: Service
metadata:
  name: studio-booking-backend
  namespace: startup
  labels:
    app: studio-booking-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: studio-booking-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-booking-backend
  namespace: startup
  labels:
    app: studio-booking-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studio-booking-backend
  template:
    metadata:
      labels:
        app: studio-booking-backend
        tier: backend
    spec:
      containers:
        - name: backend
          image: the_startup-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: studio-booking-config
            - secretRef:
                name: studio-booking-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
      restartPolicy: Always