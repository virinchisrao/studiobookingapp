apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studio-booking-ingress
  namespace: startup
  labels:
    app: studio-booking
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, Accept, Origin, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"
spec:
  ingressClassName: nginx
  rules:
    # For local development, we don't specify host so it works on any hostname
    # For production, add: host: yourdomain.com
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: studio-booking-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studio-booking-frontend
                port:
                  number: 80